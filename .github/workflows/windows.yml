name: Build Avant for Windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/Avant.exe dist/Avant.exe
          Compress-Archive -Path dist/Avant.exe -DestinationPath Avant-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Avant-Windows-x64
          path: Avant-Windows-x64.zip
