<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>avant</title>
<style>
:root { color-scheme: dark; --black: #000; --white: #fff; --line: rgba(255,255,255,.24); --dim: rgba(255,255,255,.55); }
* { box-sizing: border-box; }
html,body { height:100%; margin:0; overflow:hidden; background:var(--black); color:var(--white); font:13px "Segoe UI",Arial,sans-serif; user-select:none; }
button,input { font:inherit; }
button { color:inherit; cursor:pointer; background:transparent; border:0; }
button:focus-visible, input:focus-visible { outline:1px solid #fff; outline-offset:-1px; }
button:disabled { cursor:default; opacity:.25; }
.shell { height:78px; border-bottom:1px solid var(--line); }
.top { height:35px; display:flex; align-items:stretch; gap:0; border-bottom:1px solid var(--line); }
.brand { width:95px; flex:none; padding-left:18px; display:flex; align-items:center; font-size:14px; letter-spacing:-.6px; font-weight:700; }
.tabs { min-width:0; flex:1; display:flex; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { height:35px; min-width:102px; max-width:190px; flex:1 1 154px; display:flex; align-items:center; padding:0 7px 0 13px; gap:7px; border-left:1px solid var(--line); border-bottom:1px solid transparent; color:var(--dim); cursor:pointer; }
.tab.active { color:#fff; border-bottom:2px solid #fff; }
.tab:hover { color:#fff; }
.tab-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
.tab.private .tab-title::before { content:"◌ "; font-size:13px; }
.tab-x { width:22px; height:24px; flex:none; padding:0; font-size:17px; font-weight:300; color:var(--dim); }
.tab-x:hover { color:#fff; }
.top-action { width:38px; flex:none; display:grid; place-items:center; border-left:1px solid var(--line); font-size:19px; line-height:1; }
.top-action:hover, .tool:hover:not(:disabled) { background:rgba(255,255,255,.10); }
.top-action.private { font-size:13px; }
.nav { height:42px; display:flex; gap:0; align-items:stretch; padding:0 7px; }
.tool { width:38px; height:41px; flex:none; display:grid; place-items:center; font-family:Arial,sans-serif; font-size:18px; }
.tool.small { font-size:16px; }
.address-box { flex:1; display:flex; align-items:center; height:29px; margin:auto 7px; border:1px solid var(--line); min-width:80px; }
.address-box:focus-within { border-color:#fff; }
#address { width:100%; height:100%; min-width:0; outline:0; border:0; background:transparent; color:var(--white); font-size:12px; padding:0 11px; user-select:text; }
#address::placeholder { color:var(--dim); }
#settings-pane { height:56px; display:none; align-items:center; gap:13px; padding:0 18px; border-bottom:1px solid var(--line); background:#000; }
#settings-pane.open { display:flex; }
#settings-pane .label { min-width:58px; font-size:12px; }
#nickname { width:clamp(110px,24vw,220px); background:#000; color:#fff; border:1px solid var(--line); border-radius:0; outline:0; padding:8px 10px; user-select:text; }
#nickname:focus { border-color:#fff; }
#save { height:33px; padding:0 15px; border:1px solid #fff; color:#000; background:#fff; }
#save:hover { background:#ddd; }
#note { margin-left:auto; font-size:11px; color:var(--dim); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
@media(max-width:760px) { .brand{width:71px;padding-left:11px;} .top-action{width:34px;} .tool{width:31px;} #note{display:none;} }
</style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">avant.</div>
      <div class="tabs" id="tabs" aria-label="Tabs"></div>
      <button id="new" class="top-action" title="New tab · Ctrl+T" aria-label="New tab">+</button>
      <button id="private" class="top-action private" title="New private tab · Ctrl+Shift+N" aria-label="New private tab">◌</button>
    </div>
    <div class="nav">
      <button id="back" class="tool" title="Back" aria-label="Back">‹</button>
      <button id="forward" class="tool" title="Forward" aria-label="Forward">›</button>
      <button id="reload" class="tool small" title="Reload" aria-label="Reload">↻</button>
      <div class="address-box"><input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search Google or enter URL" aria-label="Address" /></div>
      <button id="settings" class="tool" title="Settings" aria-label="Settings">···</button>
    </div>
  </div>
  <div id="settings-pane">
    <span class="label">Profile</span>
    <input id="nickname" maxlength="36" spellcheck="false" aria-label="Profile name" />
    <button id="save">Save</button>
    <span id="note">Only on this device.</span>
  </div>
<script>
(() => {
  const q = id => document.getElementById(id);
  const send = (cmd, extra = {}) => window.ipc.postMessage(JSON.stringify({cmd, ...extra}));
  const address = q('address'), tabs = q('tabs'), settings = q('settings-pane');
  let state = { tabs:[], active:null, url:'', private:false, nickname:'Guest', canBack:false, canForward:false, loading:false, settingsOpen:false };
  let lastActive = null;

  function render() {
    const addressFocused = document.activeElement === address;
    const scroll = tabs.scrollLeft;
    const fragment = document.createDocumentFragment();
    for (const tab of state.tabs) {
      const item = document.createElement('div');
      item.className = 'tab' + (tab.id === state.active ? ' active' : '') + (tab.private ? ' private' : '');
      item.title = tab.url || '';
      const label = document.createElement('span');
      label.className = 'tab-title';
      label.textContent = tab.loading ? 'Loading…' : (tab.title || 'New tab');
      const close = document.createElement('button');
      close.className = 'tab-x';
      close.textContent = '×';
      close.title = 'Close tab';
      close.setAttribute('aria-label', 'Close tab');
      close.addEventListener('click', event => {
        event.stopPropagation();
        send('close', {id:tab.id});
      });
      item.append(label, close);
      item.addEventListener('click', () => send('select', {id:tab.id}));
      fragment.append(item);
    }
    tabs.replaceChildren(fragment);
    tabs.scrollLeft = scroll;
    if (state.active !== lastActive) {
      lastActive = state.active;
      if (addressFocused) address.blur();
    }
    if (document.activeElement !== address) address.value = state.url || '';
    q('back').disabled = !state.canBack;
    q('forward').disabled = !state.canForward;
    settings.classList.toggle('open', !!state.settingsOpen);
    if (document.activeElement !== q('nickname')) q('nickname').value = state.nickname || '';
    document.title = state.private ? 'avant · private' : 'avant';
  }
  window.avantSync = data => { state = data; render(); };
  window.focusAddress = () => { address.focus(); address.select(); };
  q('new').onclick = () => send('new');
  q('private').onclick = () => send('private');
  q('back').onclick = () => send('back');
  q('forward').onclick = () => send('forward');
  q('reload').onclick = () => send('reload');
  q('settings').onclick = () => send('settings');
  q('save').onclick = () => send('nickname', {value:q('nickname').value});
  q('nickname').addEventListener('keydown', e => { if (e.key === 'Enter') q('save').click(); });
  address.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); send('navigate', {value:address.value}); address.blur(); }
    if (e.key === 'Escape') { address.value = state.url || ''; address.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (!e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === 't') { e.preventDefault(); send('new'); }
    if (key === 'w') { e.preventDefault(); send('close', {id:state.active}); }
    if (key === 'l') { e.preventDefault(); window.focusAddress(); }
    if (key === 'n' && e.shiftKey) { e.preventDefault(); send('private'); }
    if (e.key === 'Tab' && state.tabs.length) {
      e.preventDefault();
      const index = state.tabs.findIndex(tab => tab.id === state.active);
      send('select', {id:state.tabs[(index + 1) % state.tabs.length].id});
    }
  });
  render();
})();
</script>
</body>
</html>
