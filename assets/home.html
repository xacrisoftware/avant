<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>New tab · avant</title>
<style>
:root { color-scheme:dark; }
* { box-sizing:border-box; }
html,body { width:100%; min-height:100%; margin:0; background:#000; color:#fff; }
body { min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:"Segoe UI",Arial,sans-serif; }
main { width:min(540px,calc(100vw - 48px)); margin:0 auto; transform:translateY(-24px); }
h1 { font-size:clamp(60px,10vw,100px); font-weight:650; letter-spacing:-6px; line-height:1; text-align:center; margin:0 0 49px; }
form { height:51px; display:flex; align-items:center; border:1px solid rgba(255,255,255,.65); background:#000; }
form:focus-within { border-color:#fff; }
input { min-width:0; flex:1; height:100%; padding:0 18px; border:0; outline:none; background:transparent; color:#fff; font:13px "Segoe UI",Arial,sans-serif; }
input::placeholder { color:rgba(255,255,255,.55); }
button { align-self:stretch; flex:none; width:51px; background:#000; color:#fff; border:0; border-left:1px solid rgba(255,255,255,.35); font:23px Arial,sans-serif; cursor:pointer; }
button:hover,button:focus-visible { background:#fff; color:#000; }
@media(max-height:380px) { main{transform:none;} h1{font-size:54px;margin-bottom:24px;} }
</style>
</head>
<body>
<main>
  <h1>avant.</h1>
  <form id="search">
    <input id="input" type="text" placeholder="Search Google or enter URL" autocomplete="off" spellcheck="false" autofocus aria-label="Search or address" />
    <button type="submit" aria-label="Go">→</button>
  </form>
</main>
<script>
document.getElementById('search').addEventListener('submit', event => {
  event.preventDefault();
  const text = document.getElementById('input').value.trim();
  if (!text) return;
  const complete = /^https?:\/\//i.test(text);
  const domain = text.includes('.') && !/\s/.test(text) && !text.includes('://') && !text.startsWith('.');
  window.location.href = complete ? text : domain ? 'https://' + text : 'https://www.google.com/search?q=' + encodeURIComponent(text);
});
</script>
</body>
</html>
