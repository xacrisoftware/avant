[package]
name = "avant"
version = "0.2.0"
edition = "2021"
description = "A minimal Rust browser for Windows powered by Wry and the system WebView2 runtime"
license = "MIT"

[dependencies]
winit = "0.30.13"
wry = "0.57.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
